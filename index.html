<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>お絵描きボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #FBF3E3;
    --panel: #FFFFFF;
    --panel-raised: #FFEACB;
    --line: #D8C6A0;
    --text: #221D16;
    --text-dim: #5C5548;
    --text-faint: #857D6C;

    --idea: #E85A38;
    --rough: #1D8F9E;
    --done: #3D9E4D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{color-scheme: light only;}
  body{
    margin:0;
    font-family: "Zen Kaku Gothic New", -apple-system, sans-serif;
    background: var(--bg) !important;
    color: var(--text) !important;
    min-height:100vh;
    touch-action: manipulation;
  }
  input, textarea, button, select{ color-scheme: light only; -webkit-appearance: none; appearance: none; }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #FBF3E3; --panel: #FFFFFF; --panel-raised: #FFEACB;
      --line: #D8C6A0; --text: #221D16; --text-dim: #5C5548; --text-faint: #857D6C;
      --idea: #E85A38; --rough: #1D8F9E; --done: #3D9E4D;
    }
    body{ background: var(--bg) !important; color: var(--text) !important; }
    .add-bar input, .add-bar textarea, .search-box input{ background: #FFFFFF !important; color: #221D16 !important; }
  }
  .mono{font-family:"JetBrains Mono", monospace;}

  header{ padding: 26px 70px 16px; text-align:center; border-bottom: 2px solid var(--line); position:relative; }
  header h1{ font-size: 22px; font-weight:900; margin:0; letter-spacing: 0.06em; color: var(--idea); }
  header p{ margin:9px 0 0; font-size:12.5px; color: var(--text-dim); letter-spacing:0.03em; font-weight:500; }
  .folder-btn-fixed{
    position:fixed; top:16px; left:16px; z-index:60;
    border:2px solid var(--line); background: var(--panel); color: var(--text-dim);
    border-radius:50%; width:50px; height:50px; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .folder-btn-fixed:hover{border-color:var(--idea); color:var(--idea);}
  .add-btn-inline{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    border:2px solid var(--idea); background: var(--idea); color:#fff;
    border-radius:14px; padding:14px; font-size:15px; font-weight:900; cursor:pointer;
    margin-bottom:20px;
    box-shadow: 0 3px 0 #B33F24;
  }
  .add-btn-inline:active{transform: translateY(2px); box-shadow: 0 1px 0 #B33F24;}
  .trash-btn{
    position:fixed; top:16px; right:16px; z-index:60;
    border:2px solid var(--line); background: var(--panel); color: var(--text-dim);
    border-radius:50%; width:50px; height:50px; font-size:22px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .trash-btn:hover{border-color:#B33F24; color:#B33F24;}
  .trash-badge{
    position:fixed; top:14px; right:12px; z-index:61;
    background:#B33F24; color:#fff; font-size:10px; font-weight:900; border-radius:10px;
    min-width:17px; height:17px; display:none; align-items:center; justify-content:center; padding:0 4px;
  }

  .add-bar{ max-width: 820px; margin: 20px auto 6px; padding: 0 20px; display:flex; flex-direction:column; gap:10px; }
  .field-label{ font-size:11.5px; font-weight:700; color: var(--text-dim); margin-bottom:2px; }
  .add-bar input[type=text], .add-bar textarea{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:16px; font-family:inherit; background: var(--panel); color:var(--text);
  }
  .add-bar input[type=text]{height:48px;}
  .add-bar textarea{resize:vertical; height:90px;}
  .add-bar input::placeholder, .add-bar textarea::placeholder{color:var(--text-faint);}
  .add-bar input:focus, .add-bar textarea:focus{outline:none; border-color:var(--idea);}
  .add-bar-buttons{ display:flex; gap:8px; }
  .icon-btn{
    border:2px solid var(--line); background: var(--panel); border-radius:10px; padding:0 16px;
    font-size:13.5px; cursor:pointer; color:var(--text-dim); display:flex; align-items:center;
    justify-content:center; gap:6px; letter-spacing:0.02em; height:50px;
  }
  .icon-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .img-btn{ font-size:13px; color: var(--text-dim); background:none; border-style:dashed; flex:1; }
  .add-btn{
    background: var(--idea); border-color: var(--idea); color:#fff; font-weight:900; font-size:17px;
    padding:0 34px; border-radius:11px; box-shadow: 0 3px 0 #B33F24; flex:1.4;
  }
  .add-btn:hover{filter:brightness(1.05); color:#fff; transform: translateY(1px); box-shadow: 0 2px 0 #B33F24;}
  .add-btn:active{transform: translateY(3px); box-shadow: none;}

  .thumb-preview{ display:flex; align-items:center; gap:8px; max-width:820px; margin: 4px auto 0; padding: 0 20px; font-size:13px; color:var(--text-dim); }
  .thumb-preview img{height:40px; border-radius:6px; border:2px solid var(--line);}
  .thumb-preview button{ border:none; background:none; color:#E05B45; cursor:pointer; font-size:13px; font-weight:700; }

  .board{ max-width: 820px; margin: 24px auto 60px; padding: 0 20px; }
  .tab-bar{ display:flex; gap: 14px; border-bottom: 2px solid var(--line); margin-bottom: 24px; }
  .tab{
    background:none; border:none; cursor:pointer; padding: 6px 2px 14px; font-size:13.5px; font-weight:900;
    color: var(--text-dim); letter-spacing:0.01em; display:flex; align-items:baseline; gap:5px; position:relative;
    white-space:nowrap; flex-shrink:0;
  }
  .tab .n{font-family:"JetBrains Mono", monospace; font-weight:500; font-size:11px;}
  .tab::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:3px; border-radius:2px; background: transparent; }
  .tab:hover{color: var(--text);}
  .tab.active{color: var(--text);}
  .tab-idea.active::after{background:var(--idea);}
  .tab-rough.active::after{background:var(--rough);}
  .tab-done.active::after{background:var(--done);}
  .tab-idea.active .n{color:#fff; background:var(--idea); border-radius:8px; padding:1px 7px;}
  .tab-rough.active .n{color:#fff; background:var(--rough); border-radius:8px; padding:1px 7px;}
  .tab-done.active .n{color:#fff; background:var(--done); border-radius:8px; padding:1px 7px;}
  .column{display:none;}
  .column.active{display:block;}

  .search-box{width:100%; margin-bottom:18px;}
  .search-box input{
    width:100%; padding:14px 16px; border-radius:10px; border:2px solid var(--line);
    font-size:16px; background: var(--panel); color:var(--text); font-family:inherit;
  }
  .search-box input::placeholder{color:var(--text-dim);}
  .search-box input:focus{outline:none;border-color:var(--idea);}

  .cards{display:flex; flex-direction:column; gap:8px; min-height: 40px;}

  .card-wrap{ display:flex; flex-direction:column; }
  .card-row{
    background: var(--panel); border-radius:12px; padding:12px 14px; border:2px solid var(--line);
    border-left: 5px solid var(--idea); box-shadow: 0 2px 8px rgba(46,42,36,0.06);
    display:flex; align-items:center; gap:8px; touch-action: pan-y;
  }
  .card-row.type-illustration{ border-left-color:#E0972E; }
  .card-row.type-manga{ border-left-color:#2FA8B8; }
  .card-row .drag-handle{
    flex-shrink:0; color: var(--text-faint); font-size:19px; letter-spacing:-2px;
    padding:8px 4px; cursor:grab; touch-action:none; user-select:none;
  }
  .card-row .row-title-wrap{ flex:1; min-width:0; cursor:pointer; touch-action: pan-y; }
  .card-row .row-tag-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px; }
  .card-row .row-folder-tag{
    display:inline-block; font-size:10px; font-weight:700; color: var(--idea);
    background: var(--panel-raised); border-radius:6px; padding:1px 6px;
  }
  .card-row .row-type-tag{
    display:inline-flex; align-items:center; font-size:10px; font-weight:900; border-radius:6px; padding:1px 7px;
  }
  .card-row .row-type-tag.type-illustration{ color:#B37B1E; background:#FBEBCD; }
  .card-row .row-type-tag.type-manga{ color:#1D6E7A; background:#DCF0F2; }
  .card-row .row-title{ font-size:13.5px; font-weight:900; color: var(--text); line-height:1.35; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .card-row .row-btn{
    flex-shrink:0; border:none; background:none; cursor:pointer; padding:6px; display:flex; align-items:center; color: var(--text-faint);
  }
  .card-row .row-btn.star.active{color:#E0A83E;}
  .card-row .row-btn.trash:hover{color:#B33F24;}
  .card-row .row-btn.star:hover{color:#E0A83E;}
  .card-row .row-btn.caret{ transition: transform 0.15s; }
  .card-row .row-btn.caret.open{ transform: rotate(180deg); }

  .row-expand{
    display:none;
    background: var(--panel-raised);
    border:2px solid var(--line);
    border-top:none;
    border-radius:0 0 10px 10px;
    padding:10px 14px 12px;
    margin:-6px 4px 0;
    gap:8px;
    flex-wrap:wrap;
  }
  .row-expand.open{display:flex;}
  .pill{
    font-size:13px; border:2px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer;
    background: var(--panel); color: var(--text); letter-spacing:0.02em; font-weight:700;
  }
  .pill:hover{border-color:var(--text-dim);}
  .pill.rough:hover{border-color:var(--rough); color:var(--rough);}
  .pill.done:hover{border-color:var(--done); color:var(--done);}

  .empty-hint{
    font-size:14px; color:var(--text-dim); text-align:center; padding: 36px 4px;
    border:2px dashed var(--line); border-radius:10px; font-weight:500;
  }

  .drag-ghost{
    position:fixed; z-index:200; pointer-events:none; opacity:0.9;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25); border-radius:12px; transform: scale(1.02);
  }
  .drop-placeholder{
    border:2.5px dashed var(--idea);
    background: rgba(232,90,56,0.10);
    border-radius:12px;
    box-sizing:border-box;
  }
  .folder-card.drag-target-hover{
    border-color:var(--idea) !important;
    background: rgba(232,90,56,0.14) !important;
    transform: scale(1.04);
  }

  .folder-overlay{ position:fixed; inset:0; background: var(--bg); z-index:80; display:none; flex-direction:column; }
  .folder-overlay.show{display:flex;}
  .folder-overlay-header{
    display:flex; align-items:center; gap:12px; padding:18px 20px 14px;
    border-bottom:2px solid var(--line); flex-shrink:0;
  }
  .folder-back-btn{
    border:2px solid var(--line); background: var(--panel); color: var(--text);
    border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .folder-overlay-title{font-size:16px; font-weight:900; color: var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .folder-delete-btn{
    border:2px solid var(--line); background: var(--panel); color:#B33F24;
    border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }

  .folder-split{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .folder-top{ padding: 16px 20px; border-bottom: 2px solid var(--line); overflow-y:auto; max-height:60%; flex-shrink:0; }
  .folder-top-label{font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
  .folder-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .folder-card{
    background: var(--panel); border:2px solid var(--line); border-radius:14px; padding:16px 10px;
    text-align:center; cursor:pointer; transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .folder-card:hover{transform: translateY(-2px); border-color: var(--idea);}
  .folder-card .fname{font-size:14px; font-weight:900; color: var(--text); margin-bottom:4px;}
  .folder-card .fcount{font-size:11px; color: var(--text-dim); font-family:"JetBrains Mono", monospace;}
  .folder-card.new-folder{
    border-style:dashed; color: var(--text-dim); display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:13px;
  }
  .folder-card.new-folder:hover{color:var(--idea); border-color:var(--idea);}

  .folder-bottom{ flex:1; overflow-y:auto; padding: 16px 20px 40px; }
  .folder-bottom-label{font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
  .drag-card{
    background: var(--panel); border:2px solid var(--line); border-left:5px solid var(--idea);
    border-radius:10px; padding:11px 13px; margin-bottom:10px; cursor:grab; font-size:13.5px;
    font-weight:700; color:var(--text); touch-action:none; user-select:none;
  }
  .drag-card.type-illustration{ border-left-color:#E0972E; }
  .drag-card.type-manga{ border-left-color:#2FA8B8; }
  .drag-card .dsub{font-size:11px; color:var(--text-dim); font-weight:500; margin-top:3px;}

  .folder-detail{ flex:1; overflow-y:auto; padding: 18px 20px 40px; display:none; }
  .folder-detail.show{display:block;}
  .folder-detail-tabbar{ display:flex; gap: 22px; border-bottom: 2px solid var(--line); margin-bottom: 20px; }
  .folder-detail-tab{
    background:none; border:none; cursor:pointer; padding: 6px 2px 12px; font-size:14.5px;
    font-weight:900; color: var(--text-dim); display:flex; align-items:baseline; gap:7px; position:relative;
  }
  .folder-detail-tab .n{font-family:"JetBrains Mono", monospace; font-weight:500; font-size:12px;}
  .folder-detail-tab::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:3px; border-radius:2px; background: transparent; }
  .folder-detail-tab.active{color: var(--text);}
  .folder-detail-tab[data-fstate="idea"].active::after{background:var(--idea);}
  .folder-detail-tab[data-fstate="rough"].active::after{background:var(--rough);}
  .folder-detail-tab[data-fstate="done"].active::after{background:var(--done);}
  .folder-detail-tab[data-fstate="idea"].active .n{color:#fff; background:var(--idea); border-radius:8px; padding:1px 7px;}
  .folder-detail-tab[data-fstate="rough"].active .n{color:#fff; background:var(--rough); border-radius:8px; padding:1px 7px;}
  .folder-detail-tab[data-fstate="done"].active .n{color:#fff; background:var(--done); border-radius:8px; padding:1px 7px;}
  .folder-detail-panel{display:none;}
  .folder-detail-panel.active{display:block;}
  .folder-empty{text-align:center; color: var(--text-dim); font-size:13.5px; padding:30px 4px;}

  .trash-overlay{ position:fixed; inset:0; background: var(--bg); z-index:90; display:none; flex-direction:column; }
  .trash-overlay.show{display:flex;}
  .trash-list{flex:1; overflow-y:auto; padding:20px;}
  .trash-item{
    background: var(--panel); border:2px solid var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; display:flex; align-items:center; gap:10px;
  }
  .trash-item .tt{flex:1; font-size:14px; font-weight:700; color:var(--text);}
  .trash-item .tt .sub{display:block; font-size:11.5px; font-weight:500; color:var(--text-dim); margin-top:2px;}
  .trash-mini-btn{
    border:2px solid var(--line); background: var(--panel); border-radius:8px;
    padding:6px 11px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--text);
  }
  .trash-mini-btn.restore:hover{border-color:var(--done); color:var(--done);}
  .trash-mini-btn.perm:hover{border-color:#B33F24; color:#B33F24;}

  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center;
    justify-content:center; z-index:100; padding:20px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:6px;}

  /* ===== 参考画像スワイプビューアー ===== */
  .ref-viewer{
    position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center;
    z-index:300; overflow:hidden; touch-action:none;
  }
  .ref-viewer.show{ display:flex; }
  .ref-viewer-img{ max-width:100%; max-height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; }
  .ref-viewer-close{
    position:absolute; top:18px; right:18px; z-index:2; width:40px; height:40px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.15); color:#fff; font-size:18px; cursor:pointer;
  }
  .ref-viewer-count{
    position:absolute; top:24px; left:20px; z-index:2; color:#fff; font-size:13px; font-weight:700;
    background:rgba(255,255,255,0.15); border-radius:8px; padding:4px 10px; font-family:"JetBrains Mono", monospace;
  }

  /* ===== 詳細画面(全画面) ===== */
  .item-detail-overlay{ position:fixed; inset:0; background: var(--bg); z-index:85; display:none; flex-direction:column; }
  .item-detail-overlay.show{ display:flex; }
  .item-detail-header-icons{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .im-title-field{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:16px; font-weight:900; color:var(--text); font-family:inherit; background:var(--panel);
    margin-bottom:18px;
  }
  .im-title-field:focus{ outline:none; border-color:var(--idea); }
  .item-detail-header-icons .im-star{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--line); border-radius:10px; background:var(--panel);
  }
  .item-detail-header-icons .im-star.active{ border-color:#E0A83E; }
  .item-detail-body{ flex:1; overflow-y:auto; padding: 18px 20px 40px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,25,18,0.55); display:none;
    align-items:center; justify-content:center; z-index:250; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{ background: var(--panel); border-radius:16px; padding:22px; max-width:420px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height:85vh; overflow-y:auto; }
  .modal-title{font-size:16px; font-weight:900; color:var(--text); margin-bottom:14px;}
  .modal-msg{font-size:14px; color:var(--text-dim); margin-bottom:16px; line-height:1.6;}
  .modal-box input[type=text], .modal-box textarea{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:16px; font-family:inherit; background: var(--panel); color:var(--text); margin-bottom:12px;
  }
  .modal-box textarea{resize:vertical; height:80px;}
  .modal-box input:focus, .modal-box textarea:focus{outline:none; border-color:var(--idea);}
  .modal-field-label{font-size:11.5px; font-weight:700; color:var(--text-dim); margin-bottom:4px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-btn{ flex:1; border:2px solid var(--line); background: var(--panel); color: var(--text); border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .modal-btn.primary{ background: var(--idea); border-color: var(--idea); color:#fff; }
  .modal-btn.danger{ background:#B33F24; border-color:#B33F24; color:#fff; }

  .modal-box.item-modal{max-width:480px;}
  .im-image{ width:100%; border-radius:10px; display:block; border:2px solid var(--line); cursor:pointer; }
  .im-image-wrap{ position:relative; margin-bottom:14px; }
  .im-image-change{
    position:absolute; bottom:8px; right:8px; width:38px; height:38px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .im-image-change svg{ width:18px; height:18px; }
  .im-image-add-empty{
    width:100%; aspect-ratio:auto; height:90px; margin-bottom:14px; flex-direction:row; gap:8px;
  }
  .im-image-add-empty svg{ width:20px; height:20px; }
  .im-detail-edit{ height:110px; margin-bottom:16px; }
  .im-detail-view{
    font-size:14.5px; color:var(--text); white-space:pre-wrap; word-break:break-word; line-height:1.7;
    background: var(--panel-raised); border-radius:10px; padding:12px 14px; margin-bottom:16px;
  }
  .im-title{ font-size:18px; font-weight:900; color:var(--text); line-height:1.4; }
  .im-star{ flex-shrink:0; border:none; background:none; cursor:pointer; color: var(--text-faint); }
  .im-star.active{color:#E0A83E;}
  .im-folder-tag{
    display:inline-block; font-size:11px; font-weight:700; color: var(--idea);
    background: var(--panel-raised); border-radius:6px; padding:2px 8px; margin-bottom:8px;
  }
  .im-action-row{ display:flex; gap:10px; margin-bottom:14px; }
  .im-action-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    border:2px solid var(--line); background: var(--panel); border-radius:12px; padding:14px 8px;
    cursor:pointer; color:var(--text); font-size:12.5px; font-weight:700;
  }
  .im-action-btn:hover{border-color:var(--idea); color:var(--idea);}
  .im-action-btn svg{width:22px; height:22px;}
  .im-header-row{ display:flex; align-items:flex-start; gap:10px; }
  .im-trash-btn{
    flex-shrink:0; border:2px solid var(--line); background: var(--panel); border-radius:10px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
  }
  .im-trash-btn:hover{border-color:#B33F24; color:#B33F24;}
  .im-divider{border:none; border-top:1.5px solid var(--line); margin:16px 0;}

  .im-tabbar{ display:flex; gap:10px; border-bottom:2px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .im-tab{
    background:none; border:none; cursor:pointer; padding:4px 2px 10px; font-size:12.5px;
    font-weight:900; color:var(--text-dim); position:relative;
  }
  .im-tab.active{color:var(--text);}
  .im-tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:3px; background:var(--idea); border-radius:2px; }
  .im-panel{display:none;}
  .im-panel.active{display:block;}

  .im-plot-item{ margin-bottom:12px; }
  .im-plot-item .plot-tag{
    display:inline-block; font-size:11px; font-weight:900; color:#fff; background:var(--idea);
    border-radius:6px; padding:2px 8px; margin-bottom:6px;
  }
  .im-plot-item textarea{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:16px; font-family:inherit; background:var(--panel); color:var(--text); resize:vertical; height:58px;
  }
  .im-plot-item textarea:focus{outline:none; border-color:var(--idea);}

  .im-namepage-label{ font-size:11.5px; font-weight:700; color:var(--text-dim); margin:16px 0 8px; }
  .im-namepage-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .im-namepage-thumb{ position:relative; border-radius:8px; overflow:hidden; border:2px solid var(--line); aspect-ratio:3/4; }
  .im-namepage-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .im-namepage-thumb .rm{
    position:absolute; top:3px; right:3px; background:rgba(0,0,0,0.6); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:12px; cursor:pointer; line-height:1;
  }
  .im-namepage-add{
    border:2px dashed var(--line); border-radius:8px; aspect-ratio:3/4; display:flex; align-items:center;
    justify-content:center; color:var(--text-dim); font-size:24px; cursor:pointer; background:none;
  }
  .im-namepage-add:hover{border-color:var(--idea); color:var(--idea);}

  .im-script-textarea{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:16px; font-family:inherit; background:var(--panel); color:var(--text); resize:vertical; height:200px;
  }
  .im-script-textarea:focus{outline:none; border-color:var(--idea);}

  .im-template-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .im-template-chip{
    border:2px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px;
    font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;
  }
  .im-template-chip.active{ border-color:var(--idea); color:var(--idea); background:var(--panel-raised); }

  .im-progress-text{ font-size:12px; color:var(--text-dim); margin-bottom:8px; text-align:right; }
  .im-progress-bar-outer{ height:10px; background:var(--panel-raised); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .im-progress-bar-inner{ height:100%; background:var(--done); transition:width 0.2s; }
  .im-process-list{ display:flex; flex-direction:column; gap:10px; }
  .im-process-row{
    display:flex; align-items:center; gap:10px; border:2px solid var(--line); border-radius:10px;
    padding:11px 13px; cursor:pointer; background:var(--panel);
  }
  .im-process-row.done{ border-color:var(--done); background:var(--panel-raised); }
  .im-process-check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:900;
  }
  .im-process-row.done .im-process-check{ background:var(--done); border-color:var(--done); }
  .im-process-label{ font-size:14px; font-weight:700; color:var(--text); }

  .im-section-label{ font-size:11.5px; font-weight:700; color:var(--text-dim); margin:18px 0 8px; }

  .im-pagenotes-list{ display:flex; flex-direction:column; gap:10px; }
  .im-pagenote-row{ border:2px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--panel); }
  .im-pagenote-row .pn-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .im-pagenote-row .pn-label{ font-size:12px; font-weight:900; color:var(--idea); }
  .im-pagenote-row .pn-del{ border:none; background:none; color:var(--text-faint); cursor:pointer; font-size:12px; font-weight:700; }
  .im-pagenote-row .pn-del:hover{ color:#B33F24; }
  .im-pagenote-row .pn-del.confirming{ color:#B33F24; font-weight:900; }
  .im-pagenote-row textarea{
    width:100%; border:2px solid var(--line); border-radius:8px; padding:8px 10px; font-size:16px;
    font-family:inherit; background:var(--panel); color:var(--text); resize:vertical; height:54px;
  }
  .im-pagenote-row textarea:focus{ outline:none; border-color:var(--idea); }
  .im-addpage-btn{
    width:100%; border:2px dashed var(--line); border-radius:10px; padding:11px; text-align:center;
    color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer; background:none; margin-top:10px;
  }
  .im-addpage-btn:hover{ border-color:var(--idea); color:var(--idea); }
  .add-modal-imgrow{ display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .add-modal-imgbtn{
    border:2px dashed var(--line); background:none; color:var(--text-dim); border-radius:10px;
    padding:10px 14px; font-size:13px; cursor:pointer; flex:1;
  }
  .add-modal-thumb{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .add-modal-thumb img{ height:44px; border-radius:6px; border:2px solid var(--line); }
  .add-modal-thumb button{ border:none; background:none; color:#E05B45; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<button class="folder-btn-fixed" id="openFolderBtn" title="フォルダ"></button>
<button class="trash-btn" id="openTrashBtn" title="ゴミ箱"></button>
<div class="trash-badge" id="trashBadge">0</div>

<header>
  <h1>SKETCH BOARD</h1>
  <p>MEMO &nbsp;→&nbsp; DRAFT &nbsp;→&nbsp; FINISHED</p>
</header>

<div class="board">
  <button class="add-btn-inline" id="openAddBtn">＋ 追加</button>
  <div class="tab-bar">
    <button class="tab tab-idea active" data-tab="idea">書きたいもの <span class="n" id="count-idea">0</span></button>
    <button class="tab tab-rough" data-tab="rough">書き始めた <span class="n" id="count-rough">0</span></button>
    <button class="tab tab-done" data-tab="done">書き終わり <span class="n" id="count-done">0</span></button>
  </div>

  <div class="column col-idea active" data-panel="idea">
    <div class="search-box"><input type="text" id="search-idea" placeholder="描きたいものを検索"></div>
    <div class="cards" id="cards-idea"></div>
  </div>
  <div class="column col-rough" data-panel="rough">
    <div class="search-box"><input type="text" id="search-rough" placeholder="書き始めたものを検索"></div>
    <div class="cards" id="cards-rough"></div>
  </div>
  <div class="column col-done" data-panel="done">
    <div class="search-box"><input type="text" id="search-done" placeholder="書き終わったものを検索"></div>
    <div class="cards" id="cards-done"></div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<div class="ref-viewer" id="refViewer">
  <button class="ref-viewer-close" id="refViewerClose">✕</button>
  <div class="ref-viewer-count" id="refViewerCount"></div>
  <img class="ref-viewer-img" id="refViewerImg" src="">
</div>

<div class="folder-overlay" id="folderOverlay">
  <div class="folder-overlay-header">
    <button class="folder-back-btn" id="folderBackBtn">← 戻る</button>
    <div class="folder-overlay-title" id="folderOverlayTitle">フォルダ</div>
    <button class="folder-delete-btn" id="folderDeleteBtn" style="display:none;">削除</button>
  </div>

  <div class="folder-split" id="folderSplitView">
    <div class="folder-top">
      <div class="folder-top-label">フォルダ(下のメモをドラッグして追加)</div>
      <div class="folder-grid" id="folderGrid"></div>
    </div>
    <div class="folder-bottom">
      <div class="folder-bottom-label">ホームのメモ</div>
      <div id="folderDragList"></div>
    </div>
  </div>

  <div class="folder-detail" id="folderDetailView"></div>
</div>

<div class="trash-overlay" id="trashOverlay">
  <div class="folder-overlay-header">
    <button class="folder-back-btn" id="trashBackBtn">← 戻る</button>
    <div class="folder-overlay-title">ゴミ箱</div>
  </div>
  <div class="trash-list" id="trashList"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="item-detail-overlay" id="itemDetailOverlay">
  <div class="folder-overlay-header">
    <button class="folder-back-btn" id="itemDetailBackBtn">← 戻る</button>
    <div class="folder-overlay-title" style="flex:1; min-width:0;">メモ</div>
    <div class="item-detail-header-icons">
      <button class="im-star" id="idStarBtn"></button>
      <button class="im-trash-btn" id="idTrashBtn"></button>
    </div>
  </div>
  <div class="item-detail-body" id="itemDetailBody"></div>
</div>

<script>
const STORAGE_KEY = 'sketch-items';
const FOLDER_KEY = 'sketch-folders';
let items = [];
let folders = [];
let newImageData = null;

const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; };
const uid = () => 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);

const TRASH_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
const STAR_SVG = (filled) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
const CARET_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
const IMAGE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
const EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
const FOLDER_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';

function fileToDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
  }catch(e){ items = []; }
  try{
    const raw2 = localStorage.getItem(FOLDER_KEY);
    folders = raw2 ? JSON.parse(raw2) : [];
  }catch(e){ folders = []; }

  let migrated = false;
  items.forEach(it => {
    if(it.folder && !it.folderId){
      let f = folders.find(f => f.name === it.folder && f.parentId === null);
      if(!f){ f = {id: uid(), name: it.folder, parentId: null}; folders.push(f); migrated = true; }
      it.folderId = f.id;
      delete it.folder;
      migrated = true;
    }
    if(it.favorite === undefined) it.favorite = false;
    if(it.deleted === undefined) it.deleted = false;
  });
  if(migrated){ await saveItems(); await saveFolders(); }

  render();
  updateTrashBadge();
}

async function saveItems(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
  catch(e){ console.error('保存に失敗しました', e); }
}
async function saveFolders(){
  try{ localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); }
  catch(e){ console.error('保存に失敗しました', e); }
}

/* ===== メモ追加モーダル ===== */
let addModalImageData = null;

$('openAddBtn').addEventListener('click', () => openAddModal());

function openAddModal(){
  addModalImageData = null;
  let addModalType = 'illustration';
  const box = $('modalBox');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-title">メモを追加</div>
    <div class="modal-field-label">種類</div>
    <div class="im-template-row" id="addTypeRow" style="margin-bottom:14px;"></div>
    <div class="modal-field-label">タイトル</div>
    <input type="text" id="addTitle" placeholder="例: メグメグのイラスト">
    <div class="modal-field-label">詳細</div>
    <textarea id="addDetail" placeholder="例: 下から見た構図でピースをしている"></textarea>
    <div class="add-modal-imgrow">
      <label class="add-modal-imgbtn" for="addImageInput">画像を添付</label>
      <input type="file" id="addImageInput" accept="image/*" style="display:none;">
    </div>
    <div class="add-modal-thumb" id="addImagePreview" style="display:none;"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="mCancel">キャンセル</button>
      <button class="modal-btn primary" id="mOk">追加</button>
    </div>`;

  function renderAddTypeRow(){
    const row = $('addTypeRow');
    row.innerHTML = '';
    [['illustration','イラスト用'], ['manga','漫画用']].forEach(([key,label]) => {
      const chip = document.createElement('button');
      chip.className = 'im-template-chip' + (addModalType === key ? ' active' : '');
      chip.textContent = label;
      chip.onclick = (e) => { e.preventDefault(); addModalType = key; renderAddTypeRow(); };
      row.appendChild(chip);
    });
  }
  renderAddTypeRow();

  $('addImageInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    addModalImageData = await fileToDataURL(file);
    const prev = $('addImagePreview');
    prev.style.display = 'flex';
    prev.innerHTML = '';
    const img = document.createElement('img');
    img.src = addModalImageData;
    const rm = document.createElement('button');
    rm.textContent = '画像を消す';
    rm.onclick = () => { addModalImageData = null; prev.style.display = 'none'; $('addImageInput').value=''; };
    prev.appendChild(img); prev.appendChild(rm);
  });

  $('mCancel').onclick = closeModal;
  $('mOk').onclick = async () => {
    const title = $('addTitle').value.trim();
    const detail = $('addDetail').value.trim();
    if(!title && !detail && !addModalImageData){ $('addTitle').focus(); return; }
    items.unshift({
      id: uid(), title, detail, image: addModalImageData, state: 'idea',
      folderId: null, deleted: false, favorite: false, itemType: addModalType, createdAt: Date.now()
    });
    await saveItems();
    render();
    closeModal();
  };
  $('modalOverlay').classList.add('show');
  setTimeout(() => $('addTitle') && $('addTitle').focus(), 50);
}

function moveState(id, newState){
  const it = items.find(i => i.id === id);
  if(it) it.state = newState;
  saveItems();
  render();
  if(currentFolderStack.length) renderFolderDetail();
}

function trashItem(id, onDone){
  openConfirmModal('このメモをゴミ箱に移動する？', () => {
    const it = items.find(i => i.id === id);
    if(it){ it.deleted = true; it.deletedAt = Date.now(); }
    saveItems();
    render();
    updateTrashBadge();
    if(currentFolderStack.length) renderFolderDetail();
    renderFolderDragList();
    if(onDone) onDone();
  });
}

function restoreItem(id){
  const it = items.find(i => i.id === id);
  if(it){ it.deleted = false; delete it.deletedAt; }
  saveItems();
  renderTrash();
  render();
  updateTrashBadge();
}

function permanentlyDelete(id){
  openConfirmModal('完全に削除する？元に戻せないよ。', () => {
    items = items.filter(i => i.id !== id);
    saveItems();
    renderTrash();
    updateTrashBadge();
  }, true);
}

async function attachImageToCard(id, onDone){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if(!file) return;
    const data = await fileToDataURL(file);
    const it = items.find(i => i.id === id);
    if(it) it.image = data;
    await saveItems();
    render();
    if(currentFolderStack.length) renderFolderDetail();
    if(onDone) onDone();
  };
  input.click();
}

function showLightbox(src){ $('lightboxImg').src = src; $('lightbox').classList.add('show'); }
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('show'));

/* ===== 参考画像スワイプビューアー ===== */
let refViewerImages = [];
let refViewerIndex = 0;

function openRefViewer(images, index){
  refViewerImages = images;
  refViewerIndex = index;
  renderRefViewerImg();
  $('refViewer').classList.add('show');
}
function renderRefViewerImg(){
  $('refViewerImg').src = refViewerImages[refViewerIndex] || '';
  $('refViewerCount').textContent = (refViewerIndex + 1) + ' / ' + refViewerImages.length;
}
$('refViewerClose').addEventListener('click', () => { $('refViewer').classList.remove('show'); });

(function(){
  const viewer = $('refViewer');
  let startX = 0, startY = 0, dragging = false;
  viewer.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; dragging = true;
  });
  viewer.addEventListener('pointerup', (e) => {
    if(!dragging) return;
    dragging = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0 && refViewerIndex < refViewerImages.length - 1){ refViewerIndex++; renderRefViewerImg(); }
      else if(dx > 0 && refViewerIndex > 0){ refViewerIndex--; renderRefViewerImg(); }
    }
  });
})();

function toggleFavorite(id){
  const it = items.find(i => i.id === id);
  if(it) it.favorite = !it.favorite;
  saveItems();
  render();
  if(currentFolderStack.length) renderFolderDetail();
}

function closeModal(){
  $('modalOverlay').classList.remove('show');
  $('modalBox').innerHTML = '';
  $('modalBox').className = 'modal-box';
}

function openConfirmModal(message, onYes, danger){
  const box = $('modalBox'); box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg">${escapeHtml(message)}</div>
    <div class="modal-actions">
      <button class="modal-btn" id="mCancel">キャンセル</button>
      <button class="modal-btn ${danger ? 'danger' : 'primary'}" id="mOk">OK</button>
    </div>`;
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = () => { closeModal(); onYes(); };
  $('modalOverlay').classList.add('show');
}

function openPromptModal(title, placeholder, onSubmit){
  const box = $('modalBox'); box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-title">${escapeHtml(title)}</div>
    <input type="text" id="mInput" placeholder="${escapeHtml(placeholder||'')}">
    <div class="modal-actions">
      <button class="modal-btn" id="mCancel">キャンセル</button>
      <button class="modal-btn primary" id="mOk">追加</button>
    </div>`;
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = () => {
    const val = $('mInput').value.trim();
    if(!val) return;
    closeModal();
    onSubmit(val);
  };
  $('modalOverlay').classList.add('show');
  setTimeout(() => $('mInput') && $('mInput').focus(), 50);
}

function openEditModal(it, onDone){
  const box = $('modalBox'); box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-title">メモを編集</div>
    <div class="modal-field-label">種類</div>
    <div class="im-template-row" id="editTypeRow" style="margin-bottom:14px;"></div>
    <div class="modal-field-label">タイトル</div>
    <input type="text" id="mTitle" value="${escapeHtml(it.title||'')}">
    <div class="modal-field-label">詳細</div>
    <textarea id="mDetail">${escapeHtml(it.detail||'')}</textarea>
    <div class="modal-actions">
      <button class="modal-btn" id="mCancel">キャンセル</button>
      <button class="modal-btn primary" id="mOk">保存</button>
    </div>`;

  function renderEditTypeRow(){
    const row = $('editTypeRow');
    row.innerHTML = '';
    [['illustration','イラスト用'], ['manga','漫画用']].forEach(([key,label]) => {
      const chip = document.createElement('button');
      chip.className = 'im-template-chip' + ((it.itemType||'illustration') === key ? ' active' : '');
      chip.textContent = label;
      chip.onclick = (e) => { e.preventDefault(); it.itemType = key; renderEditTypeRow(); };

function folderPathLabel(folderId){
  if(!folderId) return '';
  const path = [];
  let f = folders.find(x => x.id === folderId);
  while(f){ path.unshift(f.name); f = folders.find(x => x.id === f.parentId); }
  return path.join(' / ');
}

function enableRowDrag(handle, row, wrap, it){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startRowDrag(e, row, wrap, it);
  });
}

function startRowDrag(e, row, wrap, it){
  const container = wrap.parentElement;
  if(!container) return;
  const startRect = row.getBoundingClientRect();
  const fixedLeft = startRect.left;
  const offsetY = e.clientY - startRect.top;

  const ghost = row.cloneNode(true);
  ghost.className = 'card-row drag-ghost state-' + it.state;
  ghost.style.width = startRect.width + 'px';
  ghost.style.left = fixedLeft + 'px';
  ghost.style.top = startRect.top + 'px';
  document.body.appendChild(ghost);

  const placeholder = document.createElement('div');
  placeholder.className = 'drop-placeholder';
  placeholder.style.height = wrap.getBoundingClientRect().height + 'px';

  wrap.style.display = 'none';
  container.insertBefore(placeholder, wrap);

  let autoScrollDir = 0;
  const EDGE = 90;
  const autoScrollTimer = setInterval(() => {
    if(autoScrollDir !== 0){ window.scrollBy(0, autoScrollDir * 12); }
  }, 16);

  function onMove(ev){
    ghost.style.top = (ev.clientY - offsetY) + 'px';

    if(ev.clientY < EDGE){ autoScrollDir = -1; }
    else if(ev.clientY > window.innerHeight - EDGE){ autoScrollDir = 1; }
    else{ autoScrollDir = 0; }

    const siblings = Array.from(container.children).filter(el => el !== placeholder && el !== wrap);
    let inserted = false;
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(ev.clientY < r.top + r.height / 2){
        container.insertBefore(placeholder, sib);
        inserted = true;
        break;
      }
    }
    if(!inserted){ container.appendChild(placeholder); }
  }

  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    clearInterval(autoScrollTimer);
    ghost.remove();
    container.insertBefore(wrap, placeholder);
    placeholder.remove();
    wrap.style.display = '';

    const finalIds = Array.from(container.children)
      .filter(el => el.classList.contains('card-wrap'))
      .map(el => el.querySelector('.card-row').dataset.id);
    applyReorder(finalIds);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function applyReorder(finalIds){
  const idSet = new Set(finalIds);
  const originalIdxs = [];
  items.forEach((it, idx) => { if(idSet.has(it.id)) originalIdxs.push(idx); });
  if(originalIdxs.length === 0) return;
  const insertAt = Math.min(...originalIdxs);
  const moving = finalIds.map(id => items.find(i => i.id === id)).filter(Boolean);
  items = items.filter(i => !idSet.has(i.id));
  items.splice(insertAt, 0, ...moving);
  saveItems();
  render();
  if(currentFolderStack.length) renderFolderDetail();
}

function render(){
  const searchIdea = $('search-idea').value.trim().toLowerCase();
  const searchRough = $('search-rough').value.trim().toLowerCase();
  const searchDone = $('search-done').value.trim().toLowerCase();
  const matches = (i, q) => !q || (i.title||'').toLowerCase().includes(q) || (i.detail||'').toLowerCase().includes(q);

  const alive = items.filter(i => !i.deleted);

  const ideaItems = alive.filter(i => i.state === 'idea' && matches(i, searchIdea));
  const roughItems = alive.filter(i => i.state === 'rough' && matches(i, searchRough));
  const doneItems = alive.filter(i => i.state === 'done' && matches(i, searchDone));

  $('count-idea').textContent = alive.filter(i=>i.state==='idea').length;
  $('count-rough').textContent = alive.filter(i=>i.state==='rough').length;
  $('count-done').textContent = alive.filter(i=>i.state==='done').length;

  fillColumn('cards-idea', ideaItems, '描きたいものがまだないよ。上のバーから追加してね。');
  fillColumn('cards-rough', roughItems, '書き始めたらここに移動するよ。');
  fillColumn('cards-done', doneItems, '書き終わった絵がここに並ぶよ。');
}

function fillColumn(elId, list, emptyText){
  const el = $(elId);
  el.innerHTML = '';
  if(list.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = emptyText;
    el.appendChild(hint);
    return;
  }
  list.forEach(it => el.appendChild(cardEl(it)));
}

$('folderDeleteBtn').addEventListener('click', () => {
  const fid = currentFolderStack[currentFolderStack.length - 1];
  if(!fid) return;
  const f = folders.find(x => x.id === fid);
  openConfirmModal(`「${f ? f.name : ''}」フォルダを削除する？(中のサブフォルダも削除され、メモはホームに残るよ)`, async () => {
    const toDelete = collectDescendantFolderIds(fid);
    toDelete.push(fid);
    folders = folders.filter(x => !toDelete.includes(x.id));
    items.forEach(it => { if(toDelete.includes(it.folderId)) it.folderId = null; });
    await saveFolders();
    await saveItems();
    currentFolderStack.pop();
    showFolderLevel();
    render();
  }, true);
});

function collectDescendantFolderIds(fid){
  const children = folders.filter(f => f.parentId === fid).map(f => f.id);
  let all = [...children];
  children.forEach(c => { all = all.concat(collectDescendantFolderIds(c)); });
  return all;
}

function currentFolderId(){
  return currentFolderStack.length ? currentFolderStack[currentFolderStack.length - 1] : null;
}

function showFolderLevel(){
  const fid = currentFolderId();

function enableFolderAssignDrag(cardElm, it){
  cardElm.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const startRect = cardElm.getBoundingClientRect();
    const offsetX = e.clientX - startRect.left;
    const offsetY = e.clientY - startRect.top;

    const ghost = cardElm.cloneNode(true);
    ghost.className = 'drag-card drag-ghost state-' + it.state;
    ghost.style.width = startRect.width + 'px';
    ghost.style.left = startRect.left + 'px';
    ghost.style.top = startRect.top + 'px';
    document.body.appendChild(ghost);
    cardElm.style.opacity = '0.35';

    let currentTarget = null;

    function onMove(ev){
      ghost.style.left = (ev.clientX - offsetX) + 'px';
      ghost.style.top = (ev.clientY - offsetY) + 'px';
      ghost.style.pointerEvents = 'none';

      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el ? el.closest('.folder-card') : null;
      if(currentTarget && currentTarget !== target){
        currentTarget.classList.remove('drag-target-hover');
      }
      if(target){ target.classList.add('drag-target-hover'); }
      currentTarget = target;
    }

    async function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      ghost.remove();
      cardElm.style.opacity = '';
      if(currentTarget){
        currentTarget.classList.remove('drag-target-hover');
        const fid = currentTarget.dataset.folderId;
        if(fid){
          it.folderId = fid;
          await saveItems();
          renderFolderGrid(currentFolderId());
          renderFolderDragList();
          if(currentFolderStack.length) renderFolderDetail();
          render();
        }
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function renderFolderDetail(){
  const detail = $('folderDetailView');
  const fid = currentFolderId();
  if(!fid) return;

  const groups = [
    {state:'idea', label:'書きたいもの'},
    {state:'rough', label:'書き始めた'},
    {state:'done', label:'書き終わり'}
  ];
  const prevActive = detail.querySelector('.folder-detail-tab.active');
  const activeState = prevActive ? prevActive.dataset.fstate : 'idea';

  detail.innerHTML = '';
  const tabBar = document.createElement('div');
  tabBar.className = 'folder-detail-tabbar';
  groups.forEach(g => {
    const count = items.filter(i => i.folderId === fid && i.state === g.state && !i.deleted).length;
    const tab = document.createElement('button');
    tab.className = 'folder-detail-tab' + (g.state === activeState ? ' active' : '');
    tab.dataset.fstate = g.state;
    tab.innerHTML = `${g.label} <span class="n">${count}</span>`;
    tab.onclick = () => {
      detail.querySelectorAll('.folder-detail-tab').forEach(t => t.classList.toggle('active', t === tab));
      detail.querySelectorAll('.folder-detail-panel').forEach(p => p.classList.toggle('active', p.dataset.fstate === g.state));
    };
    tabBar.appendChild(tab);
  });
  detail.appendChild(tabBar);

  groups.forEach(g => {
    const list = items.filter(i => i.folderId === fid && i.state === g.state && !i.deleted);
    const panel = document.createElement('div');
    panel.className = 'folder-detail-panel' + (g.state === activeState ? ' active' : '');
    panel.dataset.fstate = g.state;
    const cards = document.createElement('div');
    cards.className = 'cards';
    if(list.length === 0){ cards.innerHTML = '<div class="empty-hint">まだないよ。</div>'; }
    else{ list.forEach(it => cards.appendChild(cardEl(it))); }
    panel.appendChild(cards);
    detail.appendChild(panel);
  });
}

$('openTrashBtn').addEventListener('click', () => { $('trashOverlay').classList.add('show'); renderTrash(); });
$('trashBackBtn').addEventListener('click', () => { $('trashOverlay').classList.remove('show'); });

function updateTrashBadge(){
  const count = items.filter(i => i.deleted).length;
  const badge = $('trashBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
}

function renderTrash(){
  const list = $('trashList');
  list.innerHTML = '';
  const trashed = items.filter(i => i.deleted).sort((a,b) => (b.deletedAt||0) - (a.deletedAt||0));
  if(trashed.length === 0){ list.innerHTML = '<div class="folder-empty">ゴミ箱は空だよ。</div>'; return; }
  const stateLabel = {idea:'書きたいもの', rough:'書き始めた', done:'書き終わり'};
  trashed.forEach(it => {
    const row = document.createElement('div');
    row.className = 'trash-item';
    row.innerHTML = `<div class="tt">${escapeHtml(it.title || '(無題)')}<span class="sub">${stateLabel[it.state]}${it.folderId ? ' ・ ' + escapeHtml(folderPathLabel(it.folderId)) : ''}</span></div>`;
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'trash-mini-btn restore'; restoreBtn.textContent = '元に戻す';
    restoreBtn.onclick = () => restoreItem(it.id);
    const permBtn = document.createElement('button');
    permBtn.className = 'trash-mini-btn perm'; permBtn.textContent = '完全に削除';
    permBtn.onclick = () => permanentlyDelete(it.id);
    row.appendChild(restoreBtn); row.appendChild(permBtn);
    list.appendChild(row);
  });
}

loadItems();
$('openTrashBtn').innerHTML = TRASH_SVG;
$('openFolderBtn').innerHTML = FOLDER_SVG;
</script>
</body>
</html>
